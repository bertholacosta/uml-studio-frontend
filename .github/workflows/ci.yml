name: CI

# En cada pull request; el despliegue de main lo reutiliza antes de publicar
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Formato, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,css}"
      - run: npx ng test --watch=false
      - run: npm run build -- --configuration production
